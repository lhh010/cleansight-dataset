# ⚠️ 本文件现在**只服务 actionmixed**。
#
# yolo 两轨的配置与清单已下沉到 yolo/ 自己的目录:
#   yolo/classes.yaml  类别分组(两轨共享)
#   yolo/train.yaml    训练轨:数据源 / 产物路径 / 抽帧 / 在册 task+split / 超参 / 验收
#   yolo/test.yaml     benchmark 轨:同上,独立一份(生命周期不同,要冻结)
# 原先的 splits.yaml(视频 -> split)也随之并入 yolo/train.yaml 的 tasks ——
# 身份键从"视频文件名"换成了"LS task id"(文件名会随 LS 重传而变,task id 不会)。
#
# actionmixed 尚未下沉,暂用本文件;等它也下沉后本文件即可删除。
# ---------------------------------------------------------------------------

# 读 raw/exports/<项目>/ 下的最新导出。导出已按 LS 项目分子目录;
# 退役的 mixed-train 项目已在 LS 侧并入 yolo-train,动作时序标注随之在那份导出里。
exports_project: yolo-train

# 已通过人工质检、确认标注完成(只有这些任务进数据集)。
# 注:yolo 侧已改为按 LS task id 登记,这里仍是视频名前缀 —— 属 actionmixed 的待改项。
only_videos:
  - 4807dbbe-clip      # task#59
  - 65d70028-clip      # task#61
  - 63a848d5-clip      # task#68
  - 218f9117-clip      # task#50
  - b004acff-clip      # task#51
  - 05ba4406-clip      # task#52
  - 9f93cf16-clip      # task#53
  - af0e7803-clip      # task#54
  - 7e8f5b4f-clip      # task#55
  - 2c635ddc-clip      # task#69
  - fedf6ff9-clip      # task#77
  - b1b042a9-clip      # task#78
  - a2ade960-clip      # task#60
  - 3614fb62-clip      # task#62
  - f0d28b80-clip      # task#84
  - 1fcfcdea-clip      # task#85

# 抽帧 / 图像
stride: 4           # 每隔多少真实帧抽一张(30fps 下 4 ≈ 每秒 7.5 张)
jpg_quality: 90

# 稀有类别密集采样:对框数 < rare_threshold 的类别,在正常抽帧之外
# 额外采集其相邻帧(±(stride-1) 范围),以自然方式增加稀有样本。
rare_dense_sampling: true
rare_threshold: 200

# 段级切分参数(actionmixed 按段级内存哈希分 split,不落 per-video 清单)
test_ratio: 0.2
val_ratio: 0.2
seed: 1337          # 确定性 hash 的盐
